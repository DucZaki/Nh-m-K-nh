# Bật profile dev khi chạy: mvn spring-boot:run -Dspring-boot.run.profiles=dev

# Thymeleaf không cache — sửa HTML xong, sau restart/live reload thấy ngay
spring.thymeleaf.cache=false

# Tắt cache static (CSS/JS) trong dev
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# DevTools: file trong src/main/resources thay đổi cũng kích hoạt restart (khi chạy từ thư mục gốc dự án)
spring.devtools.restart.additional-paths=src/main/resources

# LiveReload (cổng 35729): cài extension trình duyệt hoặc dùng IDE hỗ trợ để tự refresh tab
spring.devtools.livereload.enabled=true
